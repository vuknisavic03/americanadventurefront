version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/platform
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Belgrade
    groups:
      payload-suite:
        patterns:
          - payload
          - "@payloadcms/*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Belgrade
    groups:
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 3
