name: Database Recovery Rehearsal

on:
  # Privremeno isključen automatski cron radi uštede besplatnih GitHub CI minuta
  # schedule:
  #   - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_VERSION: 11.17.0

jobs:
  database-recovery:
    name: Database backup and restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Set up the pinned npm version
        run: npm install --global "npm@${{ env.NPM_VERSION }}"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/platform/package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run test:e2e:install

      - name: Test backup safety checks
        run: npm run test:backup

      - name: Rehearse encrypted backup and isolated recovery
        run: npm run test:restore

      - name: Upload synthetic workflow diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: restore-drill-playwright-${{ github.run_attempt }}
          path: apps/platform/playwright-report/
          retention-days: 14
