# Netlify configuration (Root fallback)
[build]
  base = "front"
  command = "npm run build"
  publish = "dist"

# 1. API Reverse Proxy to Railway Platform
[[redirects]]
  from = "/api/*"
  to = "https://desirable-creativity-production.up.railway.app/api/:splat"
  status = 200
  force = true

# 2. Single Page Application (SPA) Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
